<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wardrobe — Архив образов и Вишлист</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-nav {
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .card-surface {
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .carousel-track {
      display: flex;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide {
      min-width: 100%;
      flex-shrink: 0;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-emerald-500 selection:text-white">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 glass-nav border-b border-white/10 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-lg shadow-emerald-900/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">МОЙ ГАРДЕРОБ</h1>
          <p id="headerSubtitle" class="text-xs text-zinc-400">Архив образов • 0</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnViewToggle" type="button" onclick="toggleFeedLayout()" title="Переключить вид (Лента / Сетка)" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-200 border border-white/10 transition">
          <svg id="iconLayoutGrid" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
        </button>
        <button type="button" onclick="openOutfitModal()" class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs transition">
          + Образ
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto px-3 sm:px-4 pt-3">

    <!-- ==================== TAB 1: ARCHIVE (LOOKBOOK FEED) ==================== -->
    <section id="viewArchive" class="space-y-3.5 animate-fade">
      <!-- Search & Tag Filters -->
      <div class="space-y-2">
        <div class="relative">
          <svg class="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.3-4.3"/>
          </svg>
          <input
            id="archiveSearchInput"
            type="text"
            oninput="handleArchiveSearch(this.value)"
            placeholder="Поиск по названию или комментарию..."
            class="w-full bg-zinc-900/90 border border-white/10 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500/60"
          />
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-1" id="archiveCategoryBar">
          <button type="button" onclick="setArchiveFilter('all')" data-cat="all" class="arch-cat-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500 text-zinc-950 shrink-0 transition">Все</button>
          <button type="button" onclick="setArchiveFilter('Повседневный')" data-cat="Повседневный" class="arch-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">Повседневный</button>
          <button type="button" onclick="setArchiveFilter('Стритвир / Деним')" data-cat="Стритвир / Деним" class="arch-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">Стритвир / Деним</button>
          <button type="button" onclick="setArchiveFilter('Вечер / Выход')" data-cat="Вечер / Выход" class="arch-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">Вечер / Выход</button>
          <button type="button" onclick="setArchiveFilter('Спорт / Зал')" data-cat="Спорт / Зал" class="arch-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">Спорт / Зал</button>
        </div>
      </div>

      <!-- Feed Container -->
      <div id="outfitsFeedContainer" class="space-y-4"></div>
    </section>

    <!-- ==================== TAB 2: WISHLIST ==================== -->
    <section id="viewWishlist" class="hidden space-y-4 animate-fade">
      <!-- Wishlist Summary & Add Bar -->
      <div class="card-surface rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-xs text-zinc-400 uppercase tracking-wider font-medium">Вишлист покупок</p>
          <div class="flex items-baseline gap-2 mt-0.5">
            <span id="wishlistTotalSum" class="text-xl font-bold text-white">0 ₽</span>
            <span id="wishlistCountBadge" class="text-xs text-emerald-400 font-medium">0 позиций</span>
          </div>
        </div>
        <button type="button" onclick="openWishlistModal()" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-xs transition flex items-center gap-1.5 shadow-lg shadow-emerald-950/50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14m-7-7h14"/></svg>
          <span>Добавить вещь</span>
        </button>
      </div>

      <!-- Wishlist Category Sub-tabs -->
      <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar pb-1" id="wishlistCategoryBar">
        <button type="button" onclick="setWishlistFilter('all')" data-wcat="all" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500 text-zinc-950 shrink-0 transition">Все</button>
        <button type="button" onclick="setWishlistFilter('Верх')" data-wcat="Верх" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">🧥 Верх</button>
        <button type="button" onclick="setWishlistFilter('Низ')" data-wcat="Низ" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">👖 Низ</button>
        <button type="button" onclick="setWishlistFilter('Обувь')" data-wcat="Обувь" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">👞 Обувь</button>
        <button type="button" onclick="setWishlistFilter('Аксессуары')" data-wcat="Аксессуары" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">⌚ Аксессуары</button>
        <button type="button" onclick="setWishlistFilter('Куплено')" data-wcat="Куплено" class="wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition">✅ Куплено</button>
      </div>

      <!-- Wishlist Grid -->
      <div id="wishlistGridContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
    </section>

  </main>

  <!-- ==================== DETAIL MODAL (SINGLE COMMENT FIELD + CAROUSEL) ==================== -->
  <div id="outfitDetailModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto">
    <div class="min-h-screen px-3 py-6 flex items-center justify-center">
      <div class="card-surface w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl border border-white/15 animate-fade">
        <!-- Modal Top Bar -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-zinc-900/80 gap-2">
          <div class="min-w-0 flex-1">
            <span id="detailCategoryBadge" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">Категория</span>
            <input id="detailTitleInput" type="text" class="w-full bg-transparent text-base font-bold text-white mt-1 focus:outline-none focus:border-b focus:border-emerald-500" placeholder="Название образа" />
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="btnDeleteOutfitModal" type="button" class="px-2.5 py-1.5 rounded-xl bg-red-500/15 hover:bg-red-500/25 text-red-400 text-xs font-semibold transition">
              Удалить
            </button>
            <button type="button" onclick="closeOutfitDetailModal()" class="w-8 h-8 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 flex items-center justify-center">
              ✕
            </button>
          </div>
        </div>

        <!-- Detail Carousel -->
        <div class="relative bg-zinc-950 select-none">
          <div id="detailCarouselViewport" class="overflow-hidden w-full aspect-[4/5] relative">
            <div id="detailCarouselTrack" class="carousel-track h-full"></div>
          </div>
          <button id="detailPrevBtn" type="button" onclick="stepDetailCarousel(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/65 hover:bg-black/85 text-white flex items-center justify-center border border-white/15 transition">‹</button>
          <button id="detailNextBtn" type="button" onclick="stepDetailCarousel(1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/65 hover:bg-black/85 text-white flex items-center justify-center border border-white/15 transition">›</button>
          <div id="detailSlideCounter" class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-black/70 text-[11px] font-semibold text-white border border-white/10">1 / 1</div>
          <div id="detailDots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/50"></div>
        </div>

        <!-- Add or remove photo in carousel -->
        <div class="px-4 py-2.5 bg-zinc-900/90 border-b border-white/10 flex items-center justify-between gap-2">
          <button id="btnDeleteSlide" type="button" onclick="deleteCurrentSlideFromActiveOutfit()" class="text-xs text-zinc-400 hover:text-red-400 transition">
            Удалить это фото
          </button>
          <label class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-emerald-400 cursor-pointer border border-emerald-500/30 transition">
            + Добавить фото в карусель
            <input type="file" accept="image/*" multiple class="hidden" onchange="appendPhotosToActiveOutfit(event)" />
          </label>
        </div>

        <!-- Single Clean Comment Field -->
        <div class="p-4 space-y-3">
          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">💬 Комментарий</label>
            <textarea
              id="detailCommentInput"
              rows="3"
              placeholder="Любые твои заметки к этому образу..."
              class="w-full bg-zinc-900 border border-white/10 rounded-xl p-3 text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
            ></textarea>
          </div>

          <button type="button" onclick="saveActiveOutfitDetails()" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs sm:text-sm transition shadow-lg shadow-emerald-950">
            Сохранить
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SIMPLIFIED CREATE OUTFIT MODAL ==================== -->
  <div id="createOutfitModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto">
    <div class="min-h-screen px-3 py-6 flex items-center justify-center">
      <div class="card-surface w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl border border-white/15 animate-fade">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-white/10 bg-zinc-900/90">
          <h3 class="text-sm font-bold text-white">Новый образ</h3>
          <button type="button" onclick="closeOutfitModal()" class="w-8 h-8 rounded-xl bg-zinc-800 text-zinc-300 hover:bg-zinc-700 flex items-center justify-center">✕</button>
        </div>

        <div class="p-4 space-y-3.5">
          <!-- Mode Switcher: Vertical Silhouette Collage vs Ready Photos -->
          <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-zinc-900 border border-white/10">
            <button id="modeBtnCollage" type="button" onclick="switchCreateMode('collage')" class="py-2 px-3 rounded-xl text-xs font-semibold bg-emerald-500 text-zinc-950 transition">
              👕 Собрать (Верх + Низ)
            </button>
            <button id="modeBtnPhotos" type="button" onclick="switchCreateMode('photos')" class="py-2 px-3 rounded-xl text-xs font-semibold text-zinc-300 hover:text-white transition">
              📸 Готовые фото
            </button>
          </div>

          <!-- MODE A: VERTICAL SILHOUETTE COLLAGE (AS WORN: TOP ABOVE, FULL PANTS BELOW, NO OVERLAP) -->
          <div id="createModeCollagePane" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <!-- Slot 1: Top -->
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-dashed border-white/20 bg-zinc-900/70 hover:border-emerald-500/60 cursor-pointer transition text-center">
                <span class="text-xs font-bold text-white">🧥 1. Верх (сверху)</span>
                <span id="slotTopStatus" class="text-[11px] text-zinc-400 mt-0.5">Выбрать фото верха</span>
                <input type="file" accept="image/*" class="hidden" onchange="loadCollageSlot(event, 'top')" />
              </label>

              <!-- Slot 2: Bottom -->
              <label class="flex flex-col items-center justify-center p-3 rounded-2xl border border-dashed border-white/20 bg-zinc-900/70 hover:border-emerald-500/60 cursor-pointer transition text-center">
                <span class="text-xs font-bold text-white">👖 2. Низ (снизу в рост)</span>
                <span id="slotBottomStatus" class="text-[11px] text-zinc-400 mt-0.5">Выбрать фото штанов</span>
                <input type="file" accept="image/*" class="hidden" onchange="loadCollageSlot(event, 'bottom')" />
              </label>

              <!-- Slot 3: Shoes (optional) -->
              <label class="flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-white/15 bg-zinc-900/40 hover:border-emerald-500/60 cursor-pointer transition text-center">
                <span class="text-[11px] font-medium text-zinc-300">👞 Обувь (под штанами)</span>
                <span id="slotShoesStatus" class="text-[10px] text-zinc-500">По желанию</span>
                <input type="file" accept="image/*" class="hidden" onchange="loadCollageSlot(event, 'shoes')" />
              </label>

              <!-- Slot 4: Accessory (optional) -->
              <label class="flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-white/15 bg-zinc-900/40 hover:border-emerald-500/60 cursor-pointer transition text-center">
                <span class="text-[11px] font-medium text-zinc-300">⌚ Часы / Деталь (сбоку)</span>
                <span id="slotAccStatus" class="text-[10px] text-zinc-500">По желанию</span>
                <input type="file" accept="image/*" class="hidden" onchange="loadCollageSlot(event, 'acc')" />
              </label>
            </div>

            <!-- Background & Scale Fine-Tuning Controls -->
            <div class="bg-zinc-900/90 p-2.5 rounded-xl border border-white/10 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="flex items-center gap-2 text-xs text-zinc-200 cursor-pointer">
                  <input id="chkAutoRemoveBg" type="checkbox" checked onchange="renderCollageCanvas()" class="rounded text-emerald-500 focus:ring-0" />
                  <span>🪄 Вырезать однотонный фон вокруг вещей</span>
                </label>
                <select id="collageBgSelect" onchange="renderCollageCanvas()" class="bg-zinc-800 text-xs text-white rounded-lg px-2 py-1 border border-white/10">
                  <option value="#141418">Темный фон</option>
                  <option value="#e5e5e0">Светлый фон</option>
                  <option value="#ede8dd">Бежевый фон</option>
                </select>
              </div>

              <!-- Proportions Sliders so Top and Pants align like worn -->
              <div class="grid grid-cols-2 gap-3 pt-1 border-t border-white/5 text-[11px] text-zinc-400">
                <label class="flex flex-col gap-1">
                  <div class="flex justify-between"><span>Размер верха</span><span id="topScaleLabel">100%</span></div>
                  <input id="topScaleRange" type="range" min="70" max="135" value="100" oninput="renderCollageCanvas()" class="accent-emerald-500 h-1.5 bg-zinc-800 rounded-lg" />
                </label>
                <label class="flex flex-col gap-1">
                  <div class="flex justify-between"><span>Размер штанов</span><span id="bottomScaleLabel">100%</span></div>
                  <input id="bottomScaleRange" type="range" min="70" max="135" value="100" oninput="renderCollageCanvas()" class="accent-emerald-500 h-1.5 bg-zinc-800 rounded-lg" />
                </label>
              </div>
            </div>

            <!-- Live Canvas Preview (Vertical Full-Length Silhouette) -->
            <div class="relative rounded-2xl overflow-hidden border border-white/15 bg-zinc-950 flex flex-col items-center justify-center p-2">
              <canvas id="collageCanvas" width="800" height="1000" class="w-full max-w-[260px] aspect-[4/5] rounded-xl shadow-inner"></canvas>
            </div>
          </div>

          <!-- MODE B: DIRECT PHOTOS / CAROUSEL UPLOAD -->
          <div id="createModePhotosPane" class="hidden space-y-2.5">
            <label class="flex flex-col items-center justify-center p-6 rounded-2xl border-2 border-dashed border-emerald-500/40 bg-zinc-900/60 hover:bg-zinc-900 cursor-pointer transition text-center">
              <svg class="w-8 h-8 text-emerald-400 mb-1.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span class="text-xs font-semibold text-white">Выбрать одно или несколько фото</span>
              <span class="text-[11px] text-zinc-400 mt-0.5">Фото на себе или отдельные кадры в карусель</span>
              <input type="file" accept="image/*" multiple class="hidden" onchange="handleDirectCarouselUpload(event)" />
            </label>
            <div id="uploadedCarouselPreviewRow" class="flex gap-2 overflow-x-auto py-1"></div>
          </div>

          <!-- Simplified Inputs: Title (optional), Category, and Single Comment Field -->
          <div class="space-y-2.5 pt-2 border-t border-white/10">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div class="sm:col-span-2">
                <input id="newOutfitTitle" type="text" placeholder="Название (например: Белый лонгслив + черные брюки)" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
              </div>
              <div>
                <select id="newOutfitCategory" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                  <option value="Повседневный">Повседневный</option>
                  <option value="Стритвир / Деним">Стритвир / Деним</option>
                  <option value="Вечер / Выход">Вечер / Выход</option>
                  <option value="Спорт / Зал">Спорт / Зал</option>
                </select>
              </div>
            </div>

            <textarea
              id="newOutfitComment"
              rows="2"
              placeholder="Комментарий (необязательно)..."
              class="w-full bg-zinc-900 border border-white/10 rounded-xl p-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
            ></textarea>
          </div>

          <button type="button" onclick="submitNewOutfit()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs sm:text-sm transition shadow-lg shadow-emerald-950">
            Сохранить образ
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== CREATE WISHLIST ITEM MODAL ==================== -->
  <div id="createWishlistModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto">
    <div class="min-h-screen px-3 py-6 flex items-center justify-center">
      <div class="card-surface w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-white/15 animate-fade">
        <div class="flex items-center justify-between px-4 py-3.5 border-b border-white/10 bg-zinc-900/90">
          <h3 class="text-sm font-bold text-white">Добавить в Вишлист</h3>
          <button type="button" onclick="closeWishlistModal()" class="w-8 h-8 rounded-xl bg-zinc-800 text-zinc-300 hover:bg-zinc-700 flex items-center justify-center">✕</button>
        </div>
        <div class="p-4 space-y-3">
          <label class="flex flex-col items-center justify-center p-4 rounded-2xl border border-dashed border-white/20 bg-zinc-900/60 hover:border-emerald-500/50 cursor-pointer transition text-center">
            <span id="wishPhotoStatus" class="text-xs font-medium text-emerald-400">📸 Загрузить фото / скриншот вещи</span>
            <input type="file" accept="image/*" class="hidden" onchange="handleWishPhotoUpload(event)" />
          </label>

          <input id="wishTitleInput" type="text" placeholder="Название вещи *" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />

          <div class="grid grid-cols-2 gap-2.5">
            <select id="wishCategoryInput" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white">
              <option value="Верх">🧥 Верх</option>
              <option value="Низ">👖 Низ</option>
              <option value="Обувь">👞 Обувь</option>
              <option value="Аксессуары">⌚ Аксессуары</option>
            </select>
            <input id="wishPriceInput" type="number" placeholder="Цена (₽)" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" />
          </div>

          <input id="wishLinkInput" type="url" placeholder="Ссылка на магазин (необязательно)" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white" />

          <textarea id="wishNoteInput" rows="2" placeholder="Комментарий (необязательно)..." class="w-full bg-zinc-900 border border-white/10 rounded-xl p-2.5 text-xs text-white"></textarea>

          <button type="button" onclick="submitNewWishItem()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold text-xs transition">
            Добавить в вишлист
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-emerald-500 text-zinc-950 font-semibold text-xs shadow-xl"></div>

  <!-- ==================== BOTTOM NAVIGATION BAR ==================== -->
  <nav class="fixed bottom-0 inset-x-0 z-40 glass-nav border-t border-white/10">
    <div class="max-w-xl mx-auto px-4 py-2 flex items-center justify-around">
      <button id="navBtnArchive" type="button" onclick="switchTab('archive')" class="flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-emerald-400 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3"/><path stroke-linecap="round" d="M3 9h18M9 21V9"/>
        </svg>
        <span class="text-[11px] font-semibold">Образы</span>
      </button>

      <!-- Center Floating Create Button -->
      <button type="button" onclick="openOutfitModal()" class="w-11 h-11 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 flex items-center justify-center shadow-lg shadow-emerald-950/80 -mt-3 border-2 border-zinc-950 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M12 5v14m-7-7h14"/>
        </svg>
      </button>

      <button id="navBtnWishlist" type="button" onclick="switchTab('wishlist')" class="flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-zinc-400 hover:text-zinc-200 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <span class="text-[11px] font-semibold">Вишлист</span>
      </button>
    </div>
  </nav>

  <script>
    // ==================== STATE & RELIABLE PERSISTENCE (INDEXEDDB + LOCALSTORAGE) ====================
    // Никаких предзагруженных демо-луков — всё, что ты удаляешь или добавляешь, сохраняется навсегда.
    const STORAGE_KEY_V2 = 'wardrobe_studio_tma_v2';
    const LEGACY_KEY_V1 = 'wardrobe_studio_tma_v1';
    const DEMO_IDS = new Set(['outfit-1', 'outfit-2', 'wish-1', 'wish-2']);

    let state = {
      activeTab: 'archive',
      feedCompactGrid: false,
      archiveCategory: 'all',
      archiveSearch: '',
      wishlistCategory: 'all',
      outfits: [],
      wishlist: [],
      cardSlideIndex: {},
      activeDetailOutfitId: null,
      detailSlideIdx: 0,
      createMode: 'collage',
      collageSlots: { top: null, bottom: null, shoes: null, acc: null },
      directUploadedPhotos: [],
      wishUploadedPhoto: null
    };

    function initTelegramWebApp() {
      try {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          tg.ready();
          tg.expand();
        }
      } catch (e) {}
    }

    function openWardrobeDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('No IndexedDB'));
        const req = window.indexedDB.open('WardrobeAppDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('stateStore')) {
            db.createObjectStore('stateStore');
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function readFromIDB() {
      try {
        const db = await openWardrobeDB();
        return await new Promise((resolve) => {
          const tx = db.transaction('stateStore', 'readonly');
          const req = tx.objectStore('stateStore').get(STORAGE_KEY_V2);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    async function writeToIDB(payload) {
      try {
        const db = await openWardrobeDB();
        const tx = db.transaction('stateStore', 'readwrite');
        tx.objectStore('stateStore').put(payload, STORAGE_KEY_V2);
      } catch (e) {}
    }

    function normalizeOutfit(o) {
      if (!o || typeof o !== 'object') return null;
      // Собираем старые поля в единое поле comment, если пользователь мигрировал со старой версии
      let comment = typeof o.comment === 'string' ? o.comment : '';
      if (!comment && Array.isArray(o.comments) && o.comments.length) {
        comment = o.comments.map(c => c.text).filter(Boolean).join('\n');
      }
      return {
        id: String(o.id || ('outfit-' + Date.now())),
        title: String(o.title || 'Образ'),
        category: String(o.category || 'Повседневный'),
        createdAt: String(o.createdAt || ''),
        images: Array.isArray(o.images) ? o.images.filter(Boolean) : [],
        comment: comment.trim()
      };
    }

    async function loadState() {
      // 1. Сначала пробуем прочитать из IndexedDB (нет лимита 5 МБ на фото)
      const idbData = await readFromIDB();
      if (idbData && typeof idbData === 'object') {
        state.outfits = Array.isArray(idbData.outfits)
          ? idbData.outfits.filter(o => o && !DEMO_IDS.has(o.id)).map(normalizeOutfit).filter(Boolean)
          : [];
        state.wishlist = Array.isArray(idbData.wishlist)
          ? idbData.wishlist.filter(w => w && !DEMO_IDS.has(w.id))
          : [];
        renderArchiveFeed();
        renderWishlist();
        return;
      }

      // 2. Если в IndexedDB пусто, проверяем localStorage v2
      try {
        const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
        if (rawV2) {
          const parsed = JSON.parse(rawV2);
          state.outfits = Array.isArray(parsed.outfits)
            ? parsed.outfits.filter(o => o && !DEMO_IDS.has(o.id)).map(normalizeOutfit).filter(Boolean)
            : [];
          state.wishlist = Array.isArray(parsed.wishlist)
            ? parsed.wishlist.filter(w => w && !DEMO_IDS.has(w.id))
            : [];
          await writeToIDB({ outfits: state.outfits, wishlist: state.wishlist });
          renderArchiveFeed();
          renderWishlist();
          return;
        }
      } catch (e) {}

      // 3. Миграция только пользовательских вещей из v1 (все демо outfit-1, outfit-2, wish-1, wish-2 отсекаются навсегда)
      try {
        const rawV1 = localStorage.getItem(LEGACY_KEY_V1);
        if (rawV1) {
          const parsedV1 = JSON.parse(rawV1);
          state.outfits = Array.isArray(parsedV1.outfits)
            ? parsedV1.outfits.filter(o => o && !DEMO_IDS.has(o.id)).map(normalizeOutfit).filter(Boolean)
            : [];
          state.wishlist = Array.isArray(parsedV1.wishlist)
            ? parsedV1.wishlist.filter(w => w && !DEMO_IDS.has(w.id))
            : [];
          localStorage.removeItem(LEGACY_KEY_V1);
        }
      } catch (e) {}

      saveState();
      renderArchiveFeed();
      renderWishlist();
    }

    function saveState() {
      const payload = {
        outfits: state.outfits,
        wishlist: state.wishlist,
        updatedAt: Date.now()
      };
      // Сохраняем в IndexedDB (гарантированно вмещает десятки МБ фотографий)
      writeToIDB(payload);
      // Дублируем в localStorage
      try {
        localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(payload));
      } catch (e) {}
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => box.classList.add('hidden'), 2200);
    }

    // ==================== NAVIGATION & TABS ====================
    function switchTab(tab) {
      state.activeTab = tab;
      document.getElementById('viewArchive').classList.toggle('hidden', tab !== 'archive');
      document.getElementById('viewWishlist').classList.toggle('hidden', tab !== 'wishlist');

      const navArch = document.getElementById('navBtnArchive');
      const navWish = document.getElementById('navBtnWishlist');

      navArch.className = `flex flex-col items-center gap-1 py-1 px-4 rounded-xl transition ${tab === 'archive' ? 'text-emerald-400' : 'text-zinc-400 hover:text-zinc-200'}`;
      navWish.className = `flex flex-col items-center gap-1 py-1 px-4 rounded-xl transition ${tab === 'wishlist' ? 'text-emerald-400' : 'text-zinc-400 hover:text-zinc-200'}`;

      updateHeaderSubtitle();
      if (tab === 'archive') renderArchiveFeed();
      if (tab === 'wishlist') renderWishlist();
    }

    function updateHeaderSubtitle() {
      const sub = document.getElementById('headerSubtitle');
      if (!sub) return;
      if (state.activeTab === 'archive') {
        sub.textContent = `Архив образов • ${state.outfits.length}`;
      } else {
        sub.textContent = `Вишлист • ${state.wishlist.filter(i => !i.bought).length} в планах`;
      }
    }

    function toggleFeedLayout() {
      state.feedCompactGrid = !state.feedCompactGrid;
      renderArchiveFeed();
      showToast(state.feedCompactGrid ? 'Вид: Сетка 2×2' : 'Вид: Лента');
    }

    // ==================== ARCHIVE FEED & INLINE CAROUSEL ====================
    function setArchiveFilter(cat) {
      state.archiveCategory = cat;
      document.querySelectorAll('.arch-cat-btn').forEach(btn => {
        const active = btn.getAttribute('data-cat') === cat;
        btn.className = active
          ? 'arch-cat-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500 text-zinc-950 shrink-0 transition'
          : 'arch-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition';
      });
      renderArchiveFeed();
    }

    function handleArchiveSearch(val) {
      state.archiveSearch = (val || '').trim().toLowerCase();
      renderArchiveFeed();
    }

    function getFilteredOutfits() {
      return state.outfits.filter(o => {
        const matchCat = state.archiveCategory === 'all' || o.category === state.archiveCategory;
        if (!matchCat) return false;
        if (!state.archiveSearch) return true;
        const hay = [o.title, o.category, o.comment || ''].join(' ').toLowerCase();
        return hay.includes(state.archiveSearch);
      });
    }

    function stepCardCarousel(event, outfitId, delta) {
      event.stopPropagation();
      const outfit = state.outfits.find(o => o.id === outfitId);
      if (!outfit || !outfit.images || outfit.images.length <= 1) return;
      const cur = state.cardSlideIndex[outfitId] || 0;
      const next = (cur + delta + outfit.images.length) % outfit.images.length;
      state.cardSlideIndex[outfitId] = next;
      renderArchiveFeed();
    }

    function renderArchiveFeed() {
      const container = document.getElementById('outfitsFeedContainer');
      if (!container) return;
      const list = getFilteredOutfits();
      updateHeaderSubtitle();

      if (list.length === 0) {
        container.className = 'space-y-4';
        container.innerHTML = `
          <div class="card-surface rounded-3xl p-8 text-center space-y-3">
            <div class="text-3xl">👕</div>
            <p class="text-sm font-bold text-white">В архиве пока нет образов</p>
            <p class="text-xs text-zinc-400">Нажми «+ Образ», чтобы собрать макет (верх + низ) или загрузить свои фото.</p>
            <button type="button" onclick="openOutfitModal()" class="px-4 py-2.5 rounded-xl bg-emerald-500 text-zinc-950 font-bold text-xs transition">
              + Добавить первый образ
            </button>
          </div>
        `;
        return;
      }

      container.className = state.feedCompactGrid ? 'grid grid-cols-2 gap-3' : 'space-y-4';

      container.innerHTML = list.map(outfit => {
        const imgs = outfit.images && outfit.images.length ? outfit.images : [];
        const curIdx = Math.min(state.cardSlideIndex[outfit.id] || 0, Math.max(0, imgs.length - 1));
        const hasMultiple = imgs.length > 1;

        if (state.feedCompactGrid) {
          return `
            <article onclick="openOutfitDetailModal('${outfit.id}')" class="card-surface rounded-2xl overflow-hidden cursor-pointer group hover:border-emerald-500/40 transition flex flex-col">
              <div class="relative aspect-[4/5] bg-zinc-950 overflow-hidden">
                <img src="${imgs[curIdx] || ''}" alt="${escapeHtml(outfit.title)}" class="w-full h-full object-cover" />
                ${hasMultiple ? `<span class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-black/70 text-[10px] font-semibold text-white">1/${imgs.length}</span>` : ''}
                <span class="absolute bottom-2 left-2 px-2 py-0.5 rounded-md bg-black/70 text-[10px] text-emerald-400 font-medium">${escapeHtml(outfit.category)}</span>
              </div>
              <div class="p-2.5">
                <h3 class="text-xs font-bold text-white line-clamp-1">${escapeHtml(outfit.title)}</h3>
                ${outfit.comment ? `<p class="text-[11px] text-zinc-400 line-clamp-1 mt-0.5">${escapeHtml(outfit.comment)}</p>` : ''}
              </div>
            </article>
          `;
        }

        return `
          <article class="card-surface rounded-3xl overflow-hidden shadow-xl transition hover:border-white/20">
            <!-- Feed Post Header -->
            <div class="px-4 py-3 flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">${escapeHtml(outfit.category)}</span>
              <div class="flex items-center gap-3">
                <button type="button" onclick="deleteOutfit('${outfit.id}')" class="text-xs text-zinc-500 hover:text-red-400 transition">Удалить</button>
                <button type="button" onclick="openOutfitDetailModal('${outfit.id}')" class="text-xs font-semibold text-emerald-400">Открыть →</button>
              </div>
            </div>

            <!-- Visual Photo / Carousel -->
            <div onclick="openOutfitDetailModal('${outfit.id}')" class="relative aspect-[4/5] bg-zinc-950 overflow-hidden cursor-pointer select-none">
              <img src="${imgs[curIdx] || ''}" alt="${escapeHtml(outfit.title)}" class="w-full h-full object-cover" />

              ${hasMultiple ? `
                <button type="button" onclick="stepCardCarousel(event, '${outfit.id}', -1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/65 hover:bg-black/85 text-white flex items-center justify-center border border-white/15">‹</button>
                <button type="button" onclick="stepCardCarousel(event, '${outfit.id}', 1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/65 hover:bg-black/85 text-white flex items-center justify-center border border-white/15">›</button>
                <div class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-black/70 text-[11px] font-semibold text-white border border-white/10">
                  ${curIdx + 1} / ${imgs.length}
                </div>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/55">
                  ${imgs.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === curIdx ? 'bg-emerald-400 w-3.5' : 'bg-white/50'} transition-all"></span>`).join('')}
                </div>
              ` : ''}
            </div>

            <!-- Post Body: Title + Single Comment -->
            <div onclick="openOutfitDetailModal('${outfit.id}')" class="p-4 space-y-1.5 cursor-pointer">
              <h2 class="text-base font-bold text-white leading-snug">${escapeHtml(outfit.title)}</h2>
              ${outfit.comment
                ? `<p class="text-xs text-zinc-300 whitespace-pre-line leading-relaxed">${escapeHtml(outfit.comment)}</p>`
                : `<p class="text-xs text-zinc-500">Нажми, чтобы добавить свой комментарий...</p>`}
            </div>
          </article>
        `;
      }).join('');
    }

    // ==================== OUTFIT DETAIL MODAL ====================
    function openOutfitDetailModal(outfitId) {
      const outfit = state.outfits.find(o => o.id === outfitId);
      if (!outfit) return;
      state.activeDetailOutfitId = outfitId;
      state.detailSlideIdx = 0;

      document.getElementById('detailCategoryBadge').textContent = outfit.category || 'Образ';
      document.getElementById('detailTitleInput').value = outfit.title || '';
      document.getElementById('detailCommentInput').value = outfit.comment || '';

      const delBtn = document.getElementById('btnDeleteOutfitModal');
      delBtn.onclick = () => deleteOutfit(outfitId);

      renderDetailCarousel();
      document.getElementById('outfitDetailModal').classList.remove('hidden');
    }

    function closeOutfitDetailModal() {
      document.getElementById('outfitDetailModal').classList.add('hidden');
      state.activeDetailOutfitId = null;
    }

    function renderDetailCarousel() {
      const outfit = state.outfits.find(o => o.id === state.activeDetailOutfitId);
      if (!outfit) return;
      const imgs = outfit.images || [];
      const track = document.getElementById('detailCarouselTrack');
      const counter = document.getElementById('detailSlideCounter');
      const dots = document.getElementById('detailDots');
      const prevBtn = document.getElementById('detailPrevBtn');
      const nextBtn = document.getElementById('detailNextBtn');
      const delSlideBtn = document.getElementById('btnDeleteSlide');

      if (state.detailSlideIdx >= imgs.length) state.detailSlideIdx = 0;

      track.innerHTML = imgs.map(src => `
        <div class="carousel-slide h-full flex items-center justify-center bg-zinc-950">
          <img src="${src}" class="w-full h-full object-cover" alt="Фото образа" />
        </div>
      `).join('');

      track.style.transform = `translateX(-${state.detailSlideIdx * 100}%)`;
      counter.textContent = `${state.detailSlideIdx + 1} / ${imgs.length}`;

      const multi = imgs.length > 1;
      prevBtn.classList.toggle('hidden', !multi);
      nextBtn.classList.toggle('hidden', !multi);
      dots.classList.toggle('hidden', !multi);
      if (delSlideBtn) delSlideBtn.classList.toggle('hidden', !multi);

      dots.innerHTML = imgs.map((_, i) => `
        <button type="button" onclick="jumpDetailSlide(${i})" class="h-1.5 rounded-full transition-all ${i === state.detailSlideIdx ? 'w-4 bg-emerald-400' : 'w-1.5 bg-white/50'}"></button>
      `).join('');
    }

    function stepDetailCarousel(delta) {
      const outfit = state.outfits.find(o => o.id === state.activeDetailOutfitId);
      if (!outfit || !outfit.images || outfit.images.length <= 1) return;
      state.detailSlideIdx = (state.detailSlideIdx + delta + outfit.images.length) % outfit.images.length;
      renderDetailCarousel();
    }

    function jumpDetailSlide(idx) {
      state.detailSlideIdx = idx;
      renderDetailCarousel();
    }

    function deleteCurrentSlideFromActiveOutfit() {
      const outfit = state.outfits.find(o => o.id === state.activeDetailOutfitId);
      if (!outfit || !outfit.images || outfit.images.length <= 1) return;
      outfit.images.splice(state.detailSlideIdx, 1);
      state.detailSlideIdx = Math.max(0, state.detailSlideIdx - 1);
      saveState();
      renderDetailCarousel();
      renderArchiveFeed();
      showToast('Фото удалено из карусели');
    }

    function saveActiveOutfitDetails() {
      const outfit = state.outfits.find(o => o.id === state.activeDetailOutfitId);
      if (!outfit) return;
      const newTitle = (document.getElementById('detailTitleInput').value || '').trim();
      if (newTitle) outfit.title = newTitle;
      outfit.comment = (document.getElementById('detailCommentInput').value || '').trim();
      saveState();
      renderArchiveFeed();
      closeOutfitDetailModal();
      showToast('Сохранено');
    }

    function deleteOutfit(outfitId) {
      state.outfits = state.outfits.filter(o => o.id !== outfitId);
      saveState();
      closeOutfitDetailModal();
      renderArchiveFeed();
      showToast('Образ удален');
    }

    function appendPhotosToActiveOutfit(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      const outfit = state.outfits.find(o => o.id === state.activeDetailOutfitId);
      if (!outfit) return;

      Promise.all(files.map(file => compressImageFile(file, 900))).then(dataUrls => {
        outfit.images.push(...dataUrls);
        state.detailSlideIdx = outfit.images.length - 1;
        saveState();
        renderDetailCarousel();
        renderArchiveFeed();
        showToast(`Добавлено фото (${dataUrls.length} шт.)`);
      });
    }

    // ==================== VERTICAL SILHOUETTE COLLAGE BUILDER (AS WORN) ====================
    function openOutfitModal() {
      state.collageSlots = { top: null, bottom: null, shoes: null, acc: null };
      state.directUploadedPhotos = [];
      document.getElementById('slotTopStatus').textContent = 'Выбрать фото верха';
      document.getElementById('slotTopStatus').className = 'text-[11px] text-zinc-400 mt-0.5';
      document.getElementById('slotBottomStatus').textContent = 'Выбрать фото штанов';
      document.getElementById('slotBottomStatus').className = 'text-[11px] text-zinc-400 mt-0.5';
      document.getElementById('slotShoesStatus').textContent = 'По желанию';
      document.getElementById('slotShoesStatus').className = 'text-[10px] text-zinc-500';
      document.getElementById('slotAccStatus').textContent = 'По желанию';
      document.getElementById('slotAccStatus').className = 'text-[10px] text-zinc-500';
      document.getElementById('uploadedCarouselPreviewRow').innerHTML = '';
      document.getElementById('newOutfitTitle').value = '';
      document.getElementById('newOutfitComment').value = '';
      document.getElementById('topScaleRange').value = 100;
      document.getElementById('bottomScaleRange').value = 100;

      switchCreateMode('collage');
      renderCollageCanvas();
      document.getElementById('createOutfitModal').classList.remove('hidden');
    }

    function closeOutfitModal() {
      document.getElementById('createOutfitModal').classList.add('hidden');
    }

    function switchCreateMode(mode) {
      state.createMode = mode;
      const isCollage = mode === 'collage';
      document.getElementById('createModeCollagePane').classList.toggle('hidden', !isCollage);
      document.getElementById('createModePhotosPane').classList.toggle('hidden', isCollage);

      document.getElementById('modeBtnCollage').className = isCollage
        ? 'py-2 px-3 rounded-xl text-xs font-semibold bg-emerald-500 text-zinc-950 transition'
        : 'py-2 px-3 rounded-xl text-xs font-semibold text-zinc-300 hover:text-white transition';
      document.getElementById('modeBtnPhotos').className = !isCollage
        ? 'py-2 px-3 rounded-xl text-xs font-semibold bg-emerald-500 text-zinc-950 transition'
        : 'py-2 px-3 rounded-xl text-xs font-semibold text-zinc-300 hover:text-white transition';
    }

    function loadCollageSlot(event, slotKey) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      compressImageFile(file, 900).then(dataUrl => {
        const img = new Image();
        img.onload = () => {
          state.collageSlots[slotKey] = img;
          const statusMap = {
            top: 'slotTopStatus',
            bottom: 'slotBottomStatus',
            shoes: 'slotShoesStatus',
            acc: 'slotAccStatus'
          };
          const el = document.getElementById(statusMap[slotKey]);
          if (el) {
            el.textContent = '✅ Загружено';
            el.className = 'text-[11px] text-emerald-400 font-semibold mt-0.5';
          }
          renderCollageCanvas();
        };
        img.src = dataUrl;
      });
    }

    // Удаляет однотонный фон вокруг сфотографированной вещи и обрезает пустые прозрачные поля,
    // чтобы верх и штаны стыковались ровно друг под другом как при носке
    function processGarmentImage(img, removeBg) {
      const off = document.createElement('canvas');
      off.width = img.width;
      off.height = img.height;
      const ctx = off.getContext('2d');
      ctx.drawImage(img, 0, 0);

      if (!removeBg) return off;

      const imgData = ctx.getImageData(0, 0, off.width, off.height);
      const d = imgData.data;
      const w = off.width;
      const h = off.height;

      // Берем пробу фона по углам кадра
      const samplePoints = [
        0,
        (w - 1) * 4,
        (h - 1) * w * 4,
        ((h - 1) * w + (w - 1)) * 4,
        Math.floor(w / 2) * 4,
        ((h - 1) * w + Math.floor(w / 2)) * 4
      ];
      let rBg = 0, gBg = 0, bBg = 0;
      samplePoints.forEach(idx => {
        rBg += d[idx];
        gBg += d[idx + 1];
        bBg += d[idx + 2];
      });
      rBg /= samplePoints.length;
      gBg /= samplePoints.length;
      bBg /= samplePoints.length;

      const threshold = 42;
      let minX = w, minY = h, maxX = 0, maxY = 0;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const dr = d[i] - rBg;
          const dg = d[i + 1] - gBg;
          const db = d[i + 2] - bBg;
          const dist = Math.sqrt(dr * dr + dg * dg + db * db);
          if (dist < threshold) {
            d[i + 3] = 0;
          } else if (dist < threshold + 16) {
            d[i + 3] = Math.min(255, Math.round(((dist - threshold) / 16) * 255));
          }
          if (d[i + 3] > 25) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // Авто-обрезка пустых прозрачных полей вокруг вещи
      if (maxX > minX + 20 && maxY > minY + 20) {
        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;
        const cropped = document.createElement('canvas');
        cropped.width = cw;
        cropped.height = ch;
        cropped.getContext('2d').drawImage(off, minX, minY, cw, ch, 0, 0, cw, ch);
        return cropped;
      }

      return off;
    }

    // Рисует вещь строго в заданной зоне с выравниванием по вертикали (bottom = прижать к низу зоны, top = прижать к верху зоны)
    function drawAligned(ctx, imgOrCanvas, centerX, zoneY, maxW, maxH, vAlign, scaleFactor) {
      const iw = imgOrCanvas.width;
      const ih = imgOrCanvas.height;
      const baseScale = Math.min(maxW / iw, maxH / ih);
      const dw = iw * baseScale * scaleFactor;
      const dh = ih * baseScale * scaleFactor;
      const dx = centerX - dw / 2;
      let dy = zoneY + (maxH - dh) / 2;
      if (vAlign === 'bottom') {
        dy = zoneY + maxH - dh;
      } else if (vAlign === 'top') {
        dy = zoneY;
      }
      ctx.drawImage(imgOrCanvas, dx, dy, dw, dh);
    }

    function renderCollageCanvas() {
      const canvas = document.getElementById('collageCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      const bgColor = (document.getElementById('collageBgSelect') || {}).value || '#141418';
      const removeBg = (document.getElementById('chkAutoRemoveBg') || {}).checked !== false;
      const topScale = Number((document.getElementById('topScaleRange') || {}).value || 100) / 100;
      const bottomScale = Number((document.getElementById('bottomScaleRange') || {}).value || 100) / 100;

      const topLabel = document.getElementById('topScaleLabel');
      const bottomLabel = document.getElementById('bottomScaleLabel');
      if (topLabel) topLabel.textContent = Math.round(topScale * 100) + '%';
      if (bottomLabel) bottomLabel.textContent = Math.round(bottomScale * 100) + '%';

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);

      const { top, bottom, shoes, acc } = state.collageSlots;
      const hasAny = top || bottom || shoes || acc;

      if (!hasAny) {
        const isDark = bgColor === '#141418';
        ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.12)';
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2;
        // Схема вертикального силуэта: Верх сверху, Штаны в полный рост строго под ним
        ctx.strokeRect(200, 40, 400, 380);
        ctx.strokeRect(230, 440, 340, 510);
        ctx.setLineDash([]);

        ctx.fillStyle = isDark ? '#71717a' : '#52525b';
        ctx.font = '600 22px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🧥 Верх (куртка / кофта)', W / 2, 235);
        ctx.fillText('👖 Низ (штаны в полный рост)', W / 2, 695);
        return;
      }

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;

      // Центральная вертикальная ось образа (как надето на человеке: сверху куртка, строго под ней расправленные штаны без нахлеста)
      const mainCenterX = acc ? W * 0.44 : W * 0.5;

      if (shoes) {
        // Если есть обувь: Верх (25..390), Штаны (405..835), Обувь (850..975)
        if (top) {
          const pTop = processGarmentImage(top, removeBg);
          drawAligned(ctx, pTop, mainCenterX, 25, 460, 365, 'bottom', topScale);
        }
        if (bottom) {
          const pBottom = processGarmentImage(bottom, removeBg);
          drawAligned(ctx, pBottom, mainCenterX, 405, 420, 430, 'top', bottomScale);
        }
        const pShoes = processGarmentImage(shoes, removeBg);
        drawAligned(ctx, pShoes, mainCenterX, 850, 260, 125, 'top', 1.0);
      } else {
        // Только Верх и Штаны во весь рост: Верх (30..445), Штаны (460..965)
        if (top) {
          const pTop = processGarmentImage(top, removeBg);
          drawAligned(ctx, pTop, mainCenterX, 30, 500, 415, 'bottom', topScale);
        }
        if (bottom) {
          const pBottom = processGarmentImage(bottom, removeBg);
          drawAligned(ctx, pBottom, mainCenterX, 460, 450, 505, 'top', bottomScale);
        }
      }

      // Аксессуар (часы / подвеска) аккуратно справа сбоку, не перекрывая куртку и штаны
      if (acc) {
        const pAcc = processGarmentImage(acc, removeBg);
        drawAligned(ctx, pAcc, W * 0.82, 80, 190, 220, 'center', 1.0);
      }

      ctx.restore();
    }

    function handleDirectCarouselUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;
      Promise.all(files.map(f => compressImageFile(f, 900))).then(urls => {
        state.directUploadedPhotos.push(...urls);
        const row = document.getElementById('uploadedCarouselPreviewRow');
        row.innerHTML = state.directUploadedPhotos.map((u, i) => `
          <div class="relative w-16 h-20 rounded-xl overflow-hidden border border-white/15 shrink-0">
            <img src="${u}" class="w-full h-full object-cover" />
            <span class="absolute bottom-1 right-1 px-1.5 rounded bg-black/75 text-[10px] text-white">${i + 1}</span>
          </div>
        `).join('');
      });
    }

    function submitNewOutfit() {
      const { top, bottom, shoes, acc } = state.collageSlots;
      const hasCollageItems = Boolean(top || bottom || shoes || acc);
      const hasDirectPhotos = state.directUploadedPhotos.length > 0;

      if (!hasCollageItems && !hasDirectPhotos) {
        showToast('Добавь хотя бы одно фото');
        return;
      }

      let images = [];
      if (hasCollageItems) {
        const canvas = document.getElementById('collageCanvas');
        images.push(canvas.toDataURL('image/jpeg', 0.85));
      }
      if (hasDirectPhotos) {
        images.push(...state.directUploadedPhotos);
      }

      const rawTitle = (document.getElementById('newOutfitTitle').value || '').trim();
      const title = rawTitle || `Образ #${state.outfits.length + 1}`;
      const category = document.getElementById('newOutfitCategory').value || 'Повседневный';
      const comment = (document.getElementById('newOutfitComment').value || '').trim();

      const newEntry = {
        id: 'outfit-' + Date.now(),
        title,
        category,
        createdAt: new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
        images,
        comment
      };

      state.outfits.unshift(newEntry);
      saveState();
      closeOutfitModal();
      switchTab('archive');
      showToast('Образ сохранен');
    }

    // ==================== WISHLIST LOGIC ====================
    function setWishlistFilter(cat) {
      state.wishlistCategory = cat;
      document.querySelectorAll('.wish-cat-btn').forEach(btn => {
        const active = btn.getAttribute('data-wcat') === cat;
        btn.className = active
          ? 'wish-cat-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500 text-zinc-950 shrink-0 transition'
          : 'wish-cat-btn px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 text-zinc-300 border border-white/10 shrink-0 transition';
      });
      renderWishlist();
    }

    function renderWishlist() {
      const grid = document.getElementById('wishlistGridContainer');
      if (!grid) return;

      const activeItems = state.wishlist.filter(i => !i.bought);
      const totalRub = activeItems.reduce((acc, i) => acc + (Number(i.price) || 0), 0);
      document.getElementById('wishlistTotalSum').textContent = totalRub.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('wishlistCountBadge').textContent = `${activeItems.length} в планах`;

      const filtered = state.wishlist.filter(item => {
        if (state.wishlistCategory === 'all') return true;
        if (state.wishlistCategory === 'Куплено') return !!item.bought;
        return item.category === state.wishlistCategory && !item.bought;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="sm:col-span-2 card-surface rounded-2xl p-8 text-center space-y-2">
            <p class="text-sm font-semibold text-white">Вишлист пуст</p>
            <p class="text-xs text-zinc-400">Добавь вещи, которые планируешь купить.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card-surface rounded-2xl overflow-hidden flex flex-col justify-between border ${item.bought ? 'border-emerald-500/40 opacity-75' : 'border-white/10'}">
          <div>
            <div class="relative aspect-square bg-zinc-950 overflow-hidden">
              ${item.image ? `<img src="${item.image}" alt="${escapeHtml(item.title)}" class="w-full h-full object-cover" />` : `
                <div class="w-full h-full flex items-center justify-center text-zinc-600 text-xs">Без фото</div>
              `}
              <span class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-full bg-black/75 text-[11px] font-semibold text-white">${escapeHtml(item.category)}</span>
            </div>

            <div class="p-3.5 space-y-1.5">
              <div class="flex items-start justify-between gap-2">
                <h3 class="text-sm font-bold text-white leading-snug">${escapeHtml(item.title)}</h3>
                ${item.price ? `<span class="shrink-0 text-sm font-extrabold text-emerald-400">${Number(item.price).toLocaleString('ru-RU')} ₽</span>` : ''}
              </div>
              ${item.note ? `<p class="text-xs text-zinc-400 leading-relaxed">${escapeHtml(item.note)}</p>` : ''}
            </div>
          </div>

          <div class="px-3.5 pb-3.5 pt-2 border-t border-white/5 flex items-center justify-between gap-2">
            <button type="button" onclick="toggleWishBought('${item.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${item.bought ? 'bg-zinc-800 text-zinc-300' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">
              ${item.bought ? '✓ Куплено' : 'Куплено'}
            </button>
            <div class="flex items-center gap-1.5">
              ${item.link ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-200">Ссылка ↗</a>` : ''}
              <button type="button" onclick="deleteWishItem('${item.id}')" class="p-1.5 rounded-xl bg-zinc-900 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 text-xs">✕</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openWishlistModal() {
      state.wishUploadedPhoto = null;
      document.getElementById('wishPhotoStatus').textContent = '📸 Загрузить фото / скриншот вещи';
      document.getElementById('wishTitleInput').value = '';
      document.getElementById('wishPriceInput').value = '';
      document.getElementById('wishLinkInput').value = '';
      document.getElementById('wishNoteInput').value = '';
      document.getElementById('createWishlistModal').classList.remove('hidden');
    }

    function closeWishlistModal() {
      document.getElementById('createWishlistModal').classList.add('hidden');
    }

    function handleWishPhotoUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      compressImageFile(file, 700).then(dataUrl => {
        state.wishUploadedPhoto = dataUrl;
        document.getElementById('wishPhotoStatus').textContent = '✅ Фото загружено';
      });
    }

    function submitNewWishItem() {
      const title = (document.getElementById('wishTitleInput').value || '').trim();
      if (!title) {
        showToast('Укажи название вещи');
        return;
      }
      const category = document.getElementById('wishCategoryInput').value || 'Верх';
      const price = Number(document.getElementById('wishPriceInput').value) || 0;
      const link = (document.getElementById('wishLinkInput').value || '').trim();
      const note = (document.getElementById('wishNoteInput').value || '').trim();

      state.wishlist.unshift({
        id: 'wish-' + Date.now(),
        title,
        category,
        price,
        link,
        note,
        bought: false,
        image: state.wishUploadedPhoto || ''
      });

      saveState();
      closeWishlistModal();
      renderWishlist();
      updateHeaderSubtitle();
      showToast('Добавлено в вишлист');
    }

    function toggleWishBought(id) {
      const item = state.wishlist.find(i => i.id === id);
      if (!item) return;
      item.bought = !item.bought;
      saveState();
      renderWishlist();
      updateHeaderSubtitle();
    }

    function deleteWishItem(id) {
      state.wishlist = state.wishlist.filter(i => i.id !== id);
      saveState();
      renderWishlist();
      updateHeaderSubtitle();
      showToast('Удалено');
    }

    // ==================== IMAGE COMPRESSION & HELPERS ====================
    function compressImageFile(file, maxDim) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ==================== INIT ====================
    window.addEventListener('DOMContentLoaded', () => {
      initTelegramWebApp();
      loadState();
    });
  </script>
